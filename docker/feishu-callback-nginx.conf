server {
  listen 8080;
  server_name _;

  client_max_body_size 1m;

  location ~ ^/api/open/connectors/feishu/events/[A-Za-z0-9_-]+$ {
    proxy_pass http://host.docker.internal:3100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;
  }

  location ~ ^/api/open/connectors/authorize/[A-Za-z0-9_-]+(?:/start)?$ {
    limit_except GET { deny all; }
    proxy_pass http://host.docker.internal:3100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;
  }

  location ~ ^/api/open/connectors/oauth/(feishu|wechat)/callback$ {
    limit_except GET { deny all; }
    proxy_pass http://host.docker.internal:3100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;
  }

  location / {
    return 404;
  }
}
