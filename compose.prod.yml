    restart: unless-stopped
    logging:
      driver: "local"
      options:
        max-size: "${DOCKER_LOG_MAX_SIZE:-20m}"
        max-file: "${DOCKER_LOG_MAX_FILE:-5}"
    cpus: "${SMARTVIDEO_WORKER_CPUS:-2.0}"
    mem_limit: "${SMARTVIDEO_WORKER_MEM_LIMIT:-2g}"
    pids_limit: 256
    volumes:
      - smartvideo-tmp:/tmp/smartvideo
    environment:
      XIANZHI_ENV: "production"
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL is required}"
      REDIS_URL: "${REDIS_URL:?REDIS_URL is required}"
      S3_ENDPOINT: "${S3_ENDPOINT:?S3_ENDPOINT is required}"
      STORAGE_PUBLIC_ENDPOINT: "${STORAGE_PUBLIC_ENDPOINT:?STORAGE_PUBLIC_ENDPOINT is required}"
      S3_ACCESS_KEY: "${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}"
      S3_SECRET_KEY: "${S3_SECRET_KEY:?S3_SECRET_KEY is required}"
      S3_BUCKET: "${S3_BUCKET:?S3_BUCKET is required}"
      S3_REGION: "${S3_REGION:-}"
      STORAGE_MASTER_KEY: "${STORAGE_MASTER_KEY:?STORAGE_MASTER_KEY is required}"
      STORAGE_DEFAULT_PROVIDER: "${STORAGE_DEFAULT_PROVIDER:-minio}"
      STORAGE_DEFAULT_QUOTA_BYTES: "${STORAGE_DEFAULT_QUOTA_BYTES:-10737418240}"
      STORAGE_MAX_UPLOAD_BYTES: "${STORAGE_MAX_UPLOAD_BYTES:-2147483648}"
      STORAGE_AUTO_CREATE_BUCKET: "${STORAGE_AUTO_CREATE_BUCKET:-false}"
      STORAGE_FORCE_PATH_STYLE: "${STORAGE_FORCE_PATH_STYLE:-true}"
      MODEL_PROVIDER_URL: "${MODEL_PROVIDER_URL:-}"
      MODEL_PROVIDER_API_KEY: "${MODEL_PROVIDER_API_KEY:-}"
      MODEL_PROVIDER_TEXT_MODEL: "${MODEL_PROVIDER_TEXT_MODEL:-gpt-4o-mini}"
      MODEL_PROVIDER_TIMEOUT_MS: "${MODEL_PROVIDER_TIMEOUT_MS:-180000}"
      PPT_MODEL_PROVIDER_URL: "${PPT_MODEL_PROVIDER_URL:-}"
      PPT_MODEL_PROVIDER_API_KEY: "${PPT_MODEL_PROVIDER_API_KEY:-}"
      PPT_TEXT_MODEL: "${PPT_TEXT_MODEL:-}"
      PPT_MODEL_CHAT_DISABLE_THINKING: "${PPT_MODEL_CHAT_DISABLE_THINKING:-true}"
      SMARTVIDEO_ANALYSIS_ENABLED: "${SMARTVIDEO_ANALYSIS_ENABLED:-true}"
      SMARTVIDEO_OUTBOX_ENABLED: "${SMARTVIDEO_OUTBOX_ENABLED:-true}"
      SMARTVIDEO_FFPROBE_PATH: "${SMARTVIDEO_FFPROBE_PATH:-ffprobe}"
      SMARTVIDEO_FFMPEG_PATH: "${SMARTVIDEO_FFMPEG_PATH:-ffmpeg}"
      SMARTVIDEO_PROBE_TIMEOUT: "${SMARTVIDEO_PROBE_TIMEOUT:-30s}"
      SMARTVIDEO_PROCESS_TIMEOUT: "${SMARTVIDEO_PROCESS_TIMEOUT:-10m}"
      SMARTVIDEO_MAX_FILE_BYTES: "${SMARTVIDEO_MAX_FILE_BYTES:-2147483648}"
      SMARTVIDEO_MAX_VIDEO_DURATION: "${SMARTVIDEO_MAX_VIDEO_DURATION:-30m}"
      SMARTVIDEO_MAX_VIDEO_PIXELS: "${SMARTVIDEO_MAX_VIDEO_PIXELS:-8294400}"
      SMARTVIDEO_MAX_IMAGE_PIXELS: "${SMARTVIDEO_MAX_IMAGE_PIXELS:-80000000}"
      SMARTVIDEO_PROXY_MAX_WIDTH: "${SMARTVIDEO_PROXY_MAX_WIDTH:-960}"
      SMARTVIDEO_PROXY_VIDEO_BITRATE: "${SMARTVIDEO_PROXY_VIDEO_BITRATE:-1200k}"
      SMARTVIDEO_PROXY_AUDIO_BITRATE: "${SMARTVIDEO_PROXY_AUDIO_BITRATE:-96k}"
      SMARTVIDEO_ANALYSIS_MAX_ATTEMPTS: "${SMARTVIDEO_ANALYSIS_MAX_ATTEMPTS:-3}"
      SMARTVIDEO_ANALYSIS_WORKER_CONCURRENCY: "${SMARTVIDEO_ANALYSIS_WORKER_CONCURRENCY:-2}"
      SMARTVIDEO_PLAN_WORKER_CONCURRENCY: "${SMARTVIDEO_PLAN_WORKER_CONCURRENCY:-1}"
      SMARTVIDEO_PLAN_TIMEOUT: "${SMARTVIDEO_PLAN_TIMEOUT:-180s}"
      SMARTVIDEO_RENDER_CONCURRENCY: "${SMARTVIDEO_RENDER_CONCURRENCY:-1}"
      SMARTVIDEO_RENDER_WORKER_CONCURRENCY: "${SMARTVIDEO_RENDER_WORKER_CONCURRENCY:-1}"
      SMARTVIDEO_RENDER_TIMEOUT: "${SMARTVIDEO_RENDER_TIMEOUT:-10m}"
      SMARTVIDEO_RENDER_MAX_OUTPUT_BYTES: "${SMARTVIDEO_RENDER_MAX_OUTPUT_BYTES:-536870912}"
      SMARTVIDEO_RENDER_FONT_PATH: "${SMARTVIDEO_RENDER_FONT_PATH:-/usr/share/fonts/noto/NotoSansCJK-Regular.ttc}"
      SMARTVIDEO_TEMP_DIR: "/tmp/smartvideo"
      SMARTVIDEO_PLAN_MODEL: "${SMARTVIDEO_PLAN_MODEL:-smart-video-standard}"
      SMARTVIDEO_SPEECH_BASE_URL: "${SMARTVIDEO_SPEECH_BASE_URL:-}"
      SMARTVIDEO_SPEECH_API_KEY: "${SMARTVIDEO_SPEECH_API_KEY:-}"
      SMARTVIDEO_SPEECH_MODEL: "${SMARTVIDEO_SPEECH_MODEL:-smart-video-speech}"
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/smartvideo/worker.healthy"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    logging:
      driver: "local"
      options:
        max-size: "${DOCKER_LOG_MAX_SIZE:-20m}"
        max-file: "${DOCKER_LOG_MAX_FILE:-5}"
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB is required}"
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER is required}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-backup:
    image: postgres:16-alpine
    restart: unless-stopped
    logging:
      driver: "local"
      options:
        max-size: "${DOCKER_LOG_MAX_SIZE:-20m}"
        max-file: "${DOCKER_LOG_MAX_FILE:-5}"
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB is required}"
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER is required}"
      PGPASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      BACKUP_INTERVAL_SECONDS: "${BACKUP_INTERVAL_SECONDS:-86400}"
      BACKUP_RETENTION_DAYS: "${BACKUP_RETENTION_DAYS:-30}"
      BACKUP_MIN_FREE_BYTES: "${BACKUP_MIN_FREE_BYTES:-10737418240}"
    volumes:
      - ./backups/postgres:/backups
    command:
      - sh
      - -c
      - |
        set -eu
        set -o pipefail
        while true; do
          available_kb="$$(df -Pk /backups | awk 'NR == 2 {print $$4}')"
          available_bytes="$$((available_kb * 1024))"
          if [ "$$available_bytes" -lt "$${BACKUP_MIN_FREE_BYTES}" ]; then
            echo "Backup skipped: free space $$available_bytes is below minimum $${BACKUP_MIN_FREE_BYTES}."
            sleep "$${BACKUP_INTERVAL_SECONDS}"
            continue
          fi

          file="/backups/xianzhi-$$(date -u +%Y%m%dT%H%M%SZ).sql.gz"
          temp_file="$$file.part"
          if pg_dump -h postgres -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" --clean --if-exists | gzip -c > "$$temp_file"; then
            gzip -t "$$temp_file"
            test -s "$$temp_file"
            mv "$$temp_file" "$$file"
            echo "Created PostgreSQL backup: $$file"
          else
            rm -f -- "$$temp_file"
            echo "PostgreSQL backup failed."
          fi

          expired_backup_count="$$(find /backups -maxdepth 1 -type f \( -name 'xianzhi-*.sql' -o -name 'xianzhi-*.sql.gz' \) -mtime +"$${BACKUP_RETENTION_DAYS}" | wc -l)"
          echo "expired_backup_count=$$expired_backup_count retention_days=$${BACKUP_RETENTION_DAYS}"
          sleep "$${BACKUP_INTERVAL_SECONDS}"
        done
    depends_on:
      postgres:
        condition: service_healthy

  migrate:
    image: postgres:16-alpine
    restart: "no"
    logging:
      driver: "local"
      options:
        max-size: "${DOCKER_LOG_MAX_SIZE:-20m}"
        max-file: "${DOCKER_LOG_MAX_FILE:-5}"
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER is required}"
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB is required}"
      PGPASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      MIGRATION_FILES: "${MIGRATION_FILES:-}"
    volumes:
      - ./database/migrations:/migrations:ro
    command:
      - sh
      - -c
      - |
        set -eu
        if [ -z "$${MIGRATION_FILES}" ]; then
          echo "No migration files selected; skipping automatic migration."
          exit 0
        fi
        for name in $${MIGRATION_FILES}; do
          case "$${name}" in
            [0-9][0-9][0-9]-*.sql) ;;
            *) echo "Invalid migration filename: $${name}"; exit 2 ;;
          esac
          file="/migrations/$${name}"
          if [ ! -f "$${file}" ]; then
            echo "Migration file not found: $${name}"
            exit 3
          fi
          echo "Applying $$file"
          psql -h postgres -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -v ON_ERROR_STOP=1 -f "$$file"
        done
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging:
      driver: "local"
      options:
        max-size: "${DOCKER_LOG_MAX_SIZE:-20m}"
        max-file: "${DOCKER_LOG_MAX_FILE:-5}"
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    logging:
      driver: "local"
      options:
        max-size: "${DOCKER_LOG_MAX_SIZE:-20m}"
        max-file: "${DOCKER_LOG_MAX_FILE:-5}"
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_DEFAULT_USER:?RABBITMQ_DEFAULT_USER is required}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS is required}"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./ops/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 8s
      timeout: 5s
      retries: 12

  minio:
    image: "${MINIO_IMAGE:-minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e}"
    restart: unless-stopped
    logging:
      driver: "local"
      options:
        max-size: "${DOCKER_LOG_MAX_SIZE:-20m}"
        max-file: "${DOCKER_LOG_MAX_FILE:-5}"
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  disk-monitor:
    image: alpine:3.20
    restart: unless-stopped
    logging:
      driver: "local"
      options:
        max-size: "${DOCKER_LOG_MAX_SIZE:-20m}"
        max-file: "${DOCKER_LOG_MAX_FILE:-5}"
    environment:
      DISK_WARN_PERCENT: "${DISK_WARN_PERCENT:-70}"
      DISK_CRITICAL_PERCENT: "${DISK_CRITICAL_PERCENT:-80}"
      DISK_EMERGENCY_PERCENT: "${DISK_EMERGENCY_PERCENT:-90}"
      DISK_MIN_FREE_BYTES: "${DISK_MIN_FREE_BYTES:-10737418240}"
      DISK_MONITOR_INTERVAL_SECONDS: "${DISK_MONITOR_INTERVAL_SECONDS:-60}"
    volumes:
      - disk-monitor-probe:/host-volume:ro
      - ./ops/disk-guard.sh:/usr/local/bin/disk-guard.sh:ro
      - ./ops/disk-monitor.sh:/usr/local/bin/disk-monitor.sh:ro
    command: ["sh", "/usr/local/bin/disk-monitor.sh", "/host-volume"]
    healthcheck:
      test: ["CMD-SHELL", "grep -Eq '^(OK|WARNING|CRITICAL)$' /tmp/disk-state"]
      interval: 30s
      timeout: 3s
      retries: 2
      start_period: 10s

  backup-uploader:
    profiles: ["backup-uploader"]
    build:
      context: .
      dockerfile: ops/backup-uploader/Dockerfile
    image: ${BACKUP_UPLOADER_IMAGE:-xianzhi-backup-uploader}:${IMAGE_TAG:-prod}
    env_file:
      - "${BACKUP_OBS_ENV_FILE:-/dev/null}"
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      STORAGE_MASTER_KEY: ${STORAGE_MASTER_KEY:-}
      BACKUP_STORAGE_CONFIG_ID: ${BACKUP_STORAGE_CONFIG_ID:-}
    read_only: true
    restart: "no"
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
    volumes:
      - ./backups/postgres:/var/lib/zhiqiyun/backups/postgres:rw

volumes:
  app-data:
  postgres-data:
  redis-data:
  rabbitmq-data:
  minio-data:
  smartvideo-tmp:
  disk-monitor-probe:
