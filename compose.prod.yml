name: ${COMPOSE_PROJECT_NAME:-xianzhi-ai-prod}

services:
  xianzhi-ai:
    # 由 deploy-auto.sh 根据服务器 CPU 架构自动设置：linux/amd64 或 linux/arm64
    platform: "${TARGET_PLATFORM:?请使用 ./deploy-auto.sh 启动，自动设置 TARGET_PLATFORM}"
    build:
      context: .
      args:
        INSTALL_OFFICECLI: "${INSTALL_OFFICECLI:-false}"
        ALPINE_MIRROR: "${ALPINE_MIRROR:-https://mirrors.aliyun.com/alpine}"
        OFFICECLI_INSTALL_URL: "${OFFICECLI_INSTALL_URL:-https://raw.githubusercontent.com/iOfficeAI/OfficeCLI/main/install.sh}"
        OFFICECLI_INSTALL_SHA256: "${OFFICECLI_INSTALL_SHA256:-}"
    image: ${XIANZHI_IMAGE:-xianzhi-ai-platform}:${IMAGE_TAG:-prod}
    ports:
      - "${APP_BIND_HOST:-127.0.0.1}:${APP_PORT:-3100}:3100"
    volumes:
      - app-data:/app/data
    restart: unless-stopped
    environment:
      PORT: "3100"
      XIANZHI_ENV: "production"
      XIANZHI_DATA_PATH: "/app/data/store.json"
      AGENT_INVITE_LANDING_BASE_URL: "${AGENT_INVITE_LANDING_BASE_URL:-https://ai.zs-kjhn.cn}"
      AGENT_INVITE_REGISTRATION_ENABLED: "${AGENT_INVITE_REGISTRATION_ENABLED:-false}"
      APK_DOWNLOAD_ENABLED: "${APK_DOWNLOAD_ENABLED:-false}"
      APP_ACTIVATION_REPORT_ENABLED: "${APP_ACTIVATION_REPORT_ENABLED:-false}"
      MEDIA_STORAGE_PROVIDER: "${MEDIA_STORAGE_PROVIDER:-local}"
      MEDIA_STORAGE_ROOT: "${MEDIA_STORAGE_ROOT:-/app/data/media-assets}"
      MEDIA_PUBLIC_BASE_URL: "${MEDIA_PUBLIC_BASE_URL:-/api/v1/media/files}"
      MEDIA_CDN_BASE_URL: "${MEDIA_CDN_BASE_URL:-}"
      MEDIA_MAX_UPLOAD_BYTES: "${MEDIA_MAX_UPLOAD_BYTES:-12582912}"
      MEDIA_KEEP_ORIGINAL: "${MEDIA_KEEP_ORIGINAL:-true}"
      XIANZHI_STATIC_DIR: "/app/admin-vue/dist"
      XIANZHI_ADMIN_STATIC_DIR: "/app/admin-vue/dist"
      XIANZHI_USER_H5_STATIC_DIR: "/app/user-h5"
      XIANZHI_CORS_ALLOWED_ORIGINS: "${XIANZHI_CORS_ALLOWED_ORIGINS:-https://ai.zs-kjhn.cn}"
      XIANZHI_ENFORCE_RBAC: "${XIANZHI_ENFORCE_RBAC:-true}"
      XIANZHI_ENABLE_MOCK_LOGIN: "false"
      XIANZHI_ALLOW_WECHAT_MOCK_LOGIN: "false"
      XIANZHI_DEV_AUTH_FALLBACK: "false"
      XIANZHI_ALLOW_INSECURE_AUTH_TOKEN: "false"
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL is required}"
      REDIS_URL: "${REDIS_URL:?REDIS_URL is required}"
      RABBITMQ_URL: "${RABBITMQ_URL:?RABBITMQ_URL is required}"
      S3_ENDPOINT: "${S3_ENDPOINT:?S3_ENDPOINT is required}"
      STORAGE_PUBLIC_ENDPOINT: "${STORAGE_PUBLIC_ENDPOINT:?STORAGE_PUBLIC_ENDPOINT is required}"
      S3_ACCESS_KEY: "${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}"
      S3_SECRET_KEY: "${S3_SECRET_KEY:?S3_SECRET_KEY is required}"
      S3_BUCKET: "${S3_BUCKET:?S3_BUCKET is required}"
      S3_REGION: "${S3_REGION:-}"
      STORAGE_MASTER_KEY: "${STORAGE_MASTER_KEY:?STORAGE_MASTER_KEY is required}"
      CONNECTOR_SECRET_ENCRYPTION_KEY: "${CONNECTOR_SECRET_ENCRYPTION_KEY:?CONNECTOR_SECRET_ENCRYPTION_KEY is required}"
      CONNECTOR_CALLBACK_BASE_URL: "${CONNECTOR_CALLBACK_BASE_URL:?CONNECTOR_CALLBACK_BASE_URL is required}"
      CONNECTOR_QUEUE_PREFIX: "${CONNECTOR_QUEUE_PREFIX:-xianzhi:connector:jobs}"
      FEISHU_API_BASE_URL: "${FEISHU_API_BASE_URL:-https://open.feishu.cn/open-apis}"
      FEISHU_ACCOUNTS_BASE_URL: "${FEISHU_ACCOUNTS_BASE_URL:-https://accounts.feishu.cn}"
      WECHAT_OPEN_APP_ID: "${WECHAT_OPEN_APP_ID:-}"
      WECHAT_OPEN_APP_SECRET: "${WECHAT_OPEN_APP_SECRET:-}"
      WECHAT_OPEN_API_BASE_URL: "${WECHAT_OPEN_API_BASE_URL:-https://api.weixin.qq.com}"
      WECHAT_OPEN_AUTHORIZE_BASE_URL: "${WECHAT_OPEN_AUTHORIZE_BASE_URL:-https://open.weixin.qq.com}"
      WECHAT_OPEN_REDIRECT_URL: "${WECHAT_OPEN_REDIRECT_URL:-}"
      FEISHU_HTTP_TIMEOUT_SECONDS: "${FEISHU_HTTP_TIMEOUT_SECONDS:-10}"
      FEISHU_TOKEN_CACHE_PREFIX: "${FEISHU_TOKEN_CACHE_PREFIX:-xianzhi:connector:feishu:token:}"
      STORAGE_DEFAULT_PROVIDER: "${STORAGE_DEFAULT_PROVIDER:-minio}"
      STORAGE_DEFAULT_QUOTA_BYTES: "${STORAGE_DEFAULT_QUOTA_BYTES:-10737418240}"
      STORAGE_MAX_UPLOAD_BYTES: "${STORAGE_MAX_UPLOAD_BYTES:-2147483648}"
      STORAGE_UPLOAD_URL_TTL_SECONDS: "${STORAGE_UPLOAD_URL_TTL_SECONDS:-600}"
      STORAGE_ACCESS_URL_TTL_SECONDS: "${STORAGE_ACCESS_URL_TTL_SECONDS:-900}"
      STORAGE_RECYCLE_DAYS: "${STORAGE_RECYCLE_DAYS:-30}"
      STORAGE_AUTO_CREATE_BUCKET: "${STORAGE_AUTO_CREATE_BUCKET:-false}"
      STORAGE_FORCE_PATH_STYLE: "${STORAGE_FORCE_PATH_STYLE:-true}"
      STORAGE_PUBLIC_DOMAIN: "${STORAGE_PUBLIC_DOMAIN:-}"
      STORAGE_CDN_DOMAIN: "${STORAGE_CDN_DOMAIN:-}"
      MODEL_PROVIDER_URL: "${MODEL_PROVIDER_URL:-}"
      MODEL_PROVIDER_API_KEY: "${MODEL_PROVIDER_API_KEY:-}"
      MODEL_PROVIDER_KIND: "${MODEL_PROVIDER_KIND:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-https://api.openai.com}"
      MODEL_PROVIDER_IMAGE_MODEL: "${MODEL_PROVIDER_IMAGE_MODEL:-gpt-image-2}"
      MODEL_PROVIDER_TEXT_MODEL: "${MODEL_PROVIDER_TEXT_MODEL:-gpt-4o-mini}"
      PPT_MODEL_PROVIDER_URL: "${PPT_MODEL_PROVIDER_URL:-}"
      PPT_MODEL_PROVIDER_API_KEY: "${PPT_MODEL_PROVIDER_API_KEY:-}"
      PPT_TEXT_MODEL: "${PPT_TEXT_MODEL:-}"
      PPT_MODEL_CHAT_DISABLE_THINKING: "${PPT_MODEL_CHAT_DISABLE_THINKING:-}"
      PPT_VISUAL_PLANNER_MODE: "${PPT_VISUAL_PLANNER_MODE:-model}"
      PPT_AUTO_IMAGE_MODE: "${PPT_AUTO_IMAGE_MODE:-enabled}"
      PPT_VISUAL_OCR_FAILURE_MODE: "${PPT_VISUAL_OCR_FAILURE_MODE:-strict}"
      KNOWLEDGE_OCR_PROVIDER: "${KNOWLEDGE_OCR_PROVIDER:-}"
      KNOWLEDGE_OCR_ENDPOINT: "${KNOWLEDGE_OCR_ENDPOINT:-}"
      KNOWLEDGE_OCR_API_KEY: "${KNOWLEDGE_OCR_API_KEY:-}"
      MODEL_PROVIDER_VIDEO_MODEL: "${MODEL_PROVIDER_VIDEO_MODEL:-sora-2}"
      MODEL_PROVIDER_TIMEOUT_MS: "${MODEL_PROVIDER_TIMEOUT_MS:-30000}"
      IMAGE_PROVIDER_TIMEOUT_MS: "${IMAGE_PROVIDER_TIMEOUT_MS:-600000}"
      IMAGE_GENERATION_TIMEOUT_MS: "${IMAGE_GENERATION_TIMEOUT_MS:-720000}"
      MODEL_PROVIDERS_JSON: "${MODEL_PROVIDERS_JSON:-}"
      CLOUDBASE_ENABLED: "${CLOUDBASE_ENABLED:-false}"
      CLOUDBASE_ENV_ID: "${CLOUDBASE_ENV_ID:-}"
      CLOUDBASE_IMAGE_FUNCTION_NAME: "${CLOUDBASE_IMAGE_FUNCTION_NAME:-zhiqiyun-ai-image}"
      CLOUDBASE_IMAGE_FUNCTION_URL: "${CLOUDBASE_IMAGE_FUNCTION_URL:-}"
      CLOUDBASE_API_KEY: "${CLOUDBASE_API_KEY:-}"
      CLOUDBASE_IMAGE_TIMEOUT_MS: "${CLOUDBASE_IMAGE_TIMEOUT_MS:-150000}"
      CLOUDBASE_AI_WATERMARK_TEXT: "${CLOUDBASE_AI_WATERMARK_TEXT:-AI生成}"
      MINIPROGRAM_CREATION_MODES: "${MINIPROGRAM_CREATION_MODES:-image,infographic,video}"
      CONTENT_AUDIT_OUTPUT_MODE: "${CONTENT_AUDIT_OUTPUT_MODE:-}"
      ENTERPRISE_LEGAL_NAME: "${ENTERPRISE_LEGAL_NAME:-}"
      LEGAL_USER_AGREEMENT_VERSION: "${LEGAL_USER_AGREEMENT_VERSION:-}"
      LEGAL_USER_AGREEMENT_CONTENT: "${LEGAL_USER_AGREEMENT_CONTENT:-}"
      LEGAL_PRIVACY_POLICY_VERSION: "${LEGAL_PRIVACY_POLICY_VERSION:-}"
      LEGAL_PRIVACY_POLICY_CONTENT: "${LEGAL_PRIVACY_POLICY_CONTENT:-}"
      LEGAL_AI_CONTENT_RULES_VERSION: "${LEGAL_AI_CONTENT_RULES_VERSION:-}"
      LEGAL_AI_CONTENT_RULES_CONTENT: "${LEGAL_AI_CONTENT_RULES_CONTENT:-}"
      LEGAL_PLATFORM_CONVENTION_VERSION: "${LEGAL_PLATFORM_CONVENTION_VERSION:-}"
      LEGAL_PLATFORM_CONVENTION_CONTENT: "${LEGAL_PLATFORM_CONVENTION_CONTENT:-}"
      LEGAL_MINOR_PROTECTION_VERSION: "${LEGAL_MINOR_PROTECTION_VERSION:-}"
      LEGAL_MINOR_PROTECTION_CONTENT: "${LEGAL_MINOR_PROTECTION_CONTENT:-}"
      COMPLAINT_ENTRY_URL: "${COMPLAINT_ENTRY_URL:-}"
      INFRINGEMENT_COMPLAINT_URL: "${INFRINGEMENT_COMPLAINT_URL:-}"
      PAYMENT_CALLBACK_SECRET: "${PAYMENT_CALLBACK_SECRET:?PAYMENT_CALLBACK_SECRET is required}"
      ANDROID_PAYMENT_CAPABILITY: "${ANDROID_PAYMENT_CAPABILITY:-preparing}"
      ANDROID_PAYMENT_CHANNEL: "${ANDROID_PAYMENT_CHANNEL:-wechat_app}"
      WECHAT_MINI_PROGRAM_APPID: "${WECHAT_MINI_PROGRAM_APPID:-}"
      WECHAT_MINI_PROGRAM_SECRET: "${WECHAT_MINI_PROGRAM_SECRET:-}"
      WECHAT_MINI_PROGRAM_ENV_VERSION: "${WECHAT_MINI_PROGRAM_ENV_VERSION:-release}"
      WECHAT_VIRTUAL_PAY_ENABLED: "${WECHAT_VIRTUAL_PAY_ENABLED:-false}"
      WECHAT_VIRTUAL_PAY_ENV: "${WECHAT_VIRTUAL_PAY_ENV:-production}"
      WECHAT_VIRTUAL_PAY_OFFER_ID: "${WECHAT_VIRTUAL_PAY_OFFER_ID:-}"
      WECHAT_VIRTUAL_PAY_APP_KEY: "${WECHAT_VIRTUAL_PAY_APP_KEY:-}"
      WECHAT_VIRTUAL_PAY_SANDBOX_APP_KEY: "${WECHAT_VIRTUAL_PAY_SANDBOX_APP_KEY:-}"
      WECHAT_VIRTUAL_PAY_NOTIFY_TOKEN: "${WECHAT_VIRTUAL_PAY_NOTIFY_TOKEN:-}"
      WECHAT_VIRTUAL_PAY_MODE: "${WECHAT_VIRTUAL_PAY_MODE:-short_series_goods}"
      PRICE_PLAN_MEMBER_AGENT_CREATION_ENABLED: "${PRICE_PLAN_MEMBER_AGENT_CREATION_ENABLED:-false}"
      PRICE_PLAN_TEST_ENTRY_ENABLED: "${PRICE_PLAN_TEST_ENTRY_ENABLED:-false}"
      SNAPSHOT_V2_MEMBER_AGENT_FULFILLMENT_ENABLED: "${SNAPSHOT_V2_MEMBER_AGENT_FULFILLMENT_ENABLED:-false}"
      SMS_PROVIDER_URL: "${SMS_PROVIDER_URL:-}"
      SMS_PROVIDER_API_KEY: "${SMS_PROVIDER_API_KEY:-}"
      SMS_TEMPLATE_ID: "${SMS_TEMPLATE_ID:-}"
      SMS_PROVIDER_NAME: "${SMS_PROVIDER_NAME:-}"
      SMS_SIGNATURE: "${SMS_SIGNATURE:-}"
      SMS_REDIS_NAMESPACE: "${SMS_REDIS_NAMESPACE:-zhiqiyun:production:sms}"
      SMS_MOBILE_DAILY_LIMIT: "${SMS_MOBILE_DAILY_LIMIT:-10}"
      SMS_DEVICE_DAILY_LIMIT: "${SMS_DEVICE_DAILY_LIMIT:-20}"
      SMS_IP_DAILY_LIMIT: "${SMS_IP_DAILY_LIMIT:-50}"
      WECHAT_PAY_API_V3_KEY: "${WECHAT_PAY_API_V3_KEY:-}"
      WECHAT_PAY_PLATFORM_PUBLIC_KEY_PEM: "${WECHAT_PAY_PLATFORM_PUBLIC_KEY_PEM:-}"
      WECHAT_PAY_PLATFORM_CERT_PATH: "${WECHAT_PAY_PLATFORM_CERT_PATH:-}"
      WECHAT_PAY_CALLBACK_SECRET: "${WECHAT_PAY_CALLBACK_SECRET:-}"
      ALIPAY_PUBLIC_KEY_PEM: "${ALIPAY_PUBLIC_KEY_PEM:-}"
      ALIPAY_PUBLIC_KEY_PATH: "${ALIPAY_PUBLIC_KEY_PATH:-}"
      ALIPAY_CALLBACK_SECRET: "${ALIPAY_CALLBACK_SECRET:-}"
      METRICS_TOKEN: "${METRICS_TOKEN:?METRICS_TOKEN is required}"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3100/api/v1/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 6

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB is required}"
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER is required}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB is required}"
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER is required}"
      PGPASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      BACKUP_INTERVAL_SECONDS: "${BACKUP_INTERVAL_SECONDS:-86400}"
    volumes:
      - ./backups/postgres:/backups
    command:
      - sh
      - -c
      - |
        while true; do
          file="/backups/xianzhi-$$(date -u +%Y%m%dT%H%M%SZ).sql"
          pg_dump -h postgres -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" --clean --if-exists > "$$file"
          echo "Created PostgreSQL backup: $$file"
          sleep "$${BACKUP_INTERVAL_SECONDS}"
        done
    depends_on:
      postgres:
        condition: service_healthy

  migrate:
    image: postgres:16-alpine
    restart: "no"
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER is required}"
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB is required}"
      PGPASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      MIGRATION_FILES: "${MIGRATION_FILES:-}"
    volumes:
      - ./database/migrations:/migrations:ro
    command:
      - sh
      - -c
      - |
        if [ -z "$${MIGRATION_FILES}" ]; then
          echo "No migration files selected; skipping automatic migration."
          exit 0
        fi
        for name in $${MIGRATION_FILES}; do
          case "$${name}" in
            [0-9][0-9][0-9]-*.sql) ;;
            *) echo "Invalid migration filename: $${name}"; exit 2 ;;
          esac
          file="/migrations/$${name}"
          if [ ! -f "$${file}" ]; then
            echo "Migration file not found: $${name}"
            exit 3
          fi
          echo "Applying $$file"
          psql -h postgres -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -v ON_ERROR_STOP=1 -f "$$file"
        done
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_DEFAULT_USER:?RABBITMQ_DEFAULT_USER is required}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS is required}"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 8s
      timeout: 5s
      retries: 12

  minio:
    image: "${MINIO_IMAGE:-minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e}"
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  app-data:
  postgres-data:
  redis-data:
  rabbitmq-data:
  minio-data:
