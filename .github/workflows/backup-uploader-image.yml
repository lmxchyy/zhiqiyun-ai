name: backup-uploader-image

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read
  packages: write

jobs:
  backup-uploader-image:
    runs-on:
      - self-hosted
      - linux
    env:
      IMAGE: ghcr.io/${{ github.repository }}-backup-uploader
      IMAGE_TAG: git-${{ github.sha }}
      TARGET_PLATFORM: linux/amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set lowercase image name
        shell: bash
        run: echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR for main releases
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build backup uploader image
        run: docker buildx build --platform "$TARGET_PLATFORM" --file ops/backup-uploader/Dockerfile --tag "$IMAGE:$IMAGE_TAG" --load .
      - name: Run uploader contract tests
        run: |
          bash -n ops/backup-upload-object-storage.sh
          bash -n ops/backup-retention.sh
          bash -n ops/backup-offsite-upload-pending.sh
          node --test tests/backup-offsite-upload.test.mjs tests/backup-uploader-container.test.mjs tests/backup-retention.test.mjs
      - name: Push tested images and write manifest
        if: github.event_name == 'push'
        shell: bash
        env:
          ALIYUN_REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
          ALIYUN_USERNAME: ${{ secrets.ALIYUN_USERNAME }}
          ALIYUN_PASSWORD: ${{ secrets.ALIYUN_PASSWORD }}
        run: |
          set -Eeuo pipefail
          docker push "$IMAGE:$IMAGE_TAG"
          ghcr_digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$IMAGE_TAG" | sed 's#^.*@##')"
          [[ "$ghcr_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          : "${ALIYUN_REGISTRY:?ALIYUN_REGISTRY secret is required}"
          : "${ALIYUN_USERNAME:?ALIYUN_USERNAME secret is required}"
          : "${ALIYUN_PASSWORD:?ALIYUN_PASSWORD secret is required}"
          acr_image="$ALIYUN_REGISTRY/zhiqiyun-ai/backup-uploader"
          printf '%s' "$ALIYUN_PASSWORD" | docker login "$ALIYUN_REGISTRY" --username "$ALIYUN_USERNAME" --password-stdin >/dev/null
          docker tag "$IMAGE:$IMAGE_TAG" "$acr_image:$IMAGE_TAG"
          docker push "$acr_image:$IMAGE_TAG"
          acr_digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$acr_image:$IMAGE_TAG" | sed 's#^.*@##')"
          [[ "$acr_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          python3 - "$GITHUB_SHA" "$TARGET_PLATFORM" "$IMAGE" "$ghcr_digest" "$acr_image" "$acr_digest" <<'PY'
          import json
          import sys
          git_sha, platform, image, digest, acr_image, acr_digest = sys.argv[1:]
          manifest = {
              "git_sha": git_sha,
              "platform": platform,
              "image": image,
              "digest": digest,
              "image_reference": image + "@" + digest,
              "production_image_reference": acr_image + "@" + acr_digest,
              "registries": {
                  "ghcr": {"image": image, "digest": digest, "image_reference": image + "@" + digest},
                  "aliyun_acr": {"image": acr_image, "digest": acr_digest, "image_reference": acr_image + "@" + acr_digest},
              },
              "production_contract": "passed",
          }
          with open("backup-uploader-release-manifest.json", "w") as handle:
              json.dump(manifest, handle, indent=2, sort_keys=True)
              handle.write("\n")
          PY
      - name: Upload backup uploader release manifest
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: backup-uploader-release-manifest-${{ github.sha }}
          path: backup-uploader-release-manifest.json
          if-no-files-found: error
