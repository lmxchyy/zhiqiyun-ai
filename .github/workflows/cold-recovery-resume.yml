name: cold-recovery-resume

on:
  push:
    branches: ["ci/compose-local-controlled-970"]
  pull_request:
    paths:
      - 'ops/**'
      - 'database/**'
      - 'tests/cold-recovery-resume*'
      - 'tests/issue203-safe-drain-transport.Dockerfile'
      - '.github/workflows/cold-recovery-resume.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  fixed-target-owned-recovery:
    runs-on: ["controlled970-fde64cdf15024d1387c7af222c2b19e0"]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: 97040a07c67ab3f4293b2b2a470810c28a064890
      - name: Read fixed official package using ephemeral Actions identity only
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Obtain ONLY fixed app target; absent or unauthorized is failure
        shell: bash
        run: |
          set -euo pipefail
          unset DOCKER_CONTEXT DOCKER_HOST DOCKER_TLS_VERIFY DOCKER_CERT_PATH
          mkdir -p .evidence/cold-recovery-resume
          docker --host unix:///var/run/docker.sock pull --platform linux/amd64 ghcr.io/lmxchyy/zhiqiyun-ai@sha256:6ca5046ac2bd53b4ee7e5b96bab5bb04cd8d308d8a292d4fd2004bc75609390b 2>&1 | tee .evidence/cold-recovery-resume/fixed-image-acquisition.log
          test "$(docker --host unix:///var/run/docker.sock image inspect --format '{{.Id}}' ghcr.io/lmxchyy/zhiqiyun-ai@sha256:6ca5046ac2bd53b4ee7e5b96bab5bb04cd8d308d8a292d4fd2004bc75609390b)" = sha256:3955f86a32d12e68e478c70536607455546885fa07f730a6f5c9089cd0fbf2da
      - name: Verify preloaded fixed local test dependencies (NO build, pull, wget)
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker --host unix:///var/run/docker.sock image inspect --format '{{.Id}}' issue203-p4-python368-runner:local)" = sha256:4a41aa9108cf2feed713134bc7b8224507f16545ba32252c0ba1f96c15c1932e
          test "$(docker --host unix:///var/run/docker.sock image inspect --format '{{.Id}}' pgvector/pgvector:pg16)" = sha256:9b05db12a35460fff0587e009f9326e414a53e9484555547f96d214a2ba98ef7
          test "$(docker --host unix:///var/run/docker.sock image inspect --format '{{.Id}}' postgres:16-alpine)" = sha256:fff3594bf464bea0f502788874403882d8bbbe618b3250f8649e7e42fd118020
          test "$(docker --host unix:///var/run/docker.sock image inspect --format '{{.Id}}' redis:7-alpine)" = sha256:487efc0616382465781b8fdc3d6d1db449e6fd80ae23bf48432a2da6b6929908
          test "$(docker --host unix:///var/run/docker.sock image inspect --format '{{.Id}}' rabbitmq:3-management-alpine)" = sha256:1031d41f3f1611f61f0fe9011e26201967f460f93f96f92d5be0e823d59e7541
          test "$(docker --host unix:///var/run/docker.sock image inspect --format '{{.Id}}' alpine:3.20)" = sha256:bf8527eb54c3680e728d5b4b383a8ba730d72dae7236fbc8dff97ed6b224a731
          test "$(docker --host unix:///var/run/docker.sock image inspect --format '{{.Id}}' docker.m.daocloud.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e)" = sha256:69b2ec208575b69597784255eec6fa6a2985ee9e1a47f4411a51f7f5fdd193a9
          docker --host unix:///var/run/docker.sock run --rm --pull never --network none --label org.xianzhi.cold-resume.ci=controlled970-fde64cdf15024d1387c7af222c2b19e0 sha256:4a41aa9108cf2feed713134bc7b8224507f16545ba32252c0ba1f96c15c1932e sh -ec 'test "$(python3.6 --version 2>&1)" = "Python 3.6.8"; test "$(docker compose version --short)" = "2.35.1"; test "$(sha256sum /usr/local/lib/docker/cli-plugins/docker-compose | cut -d " " -f1)" = "7bdb2ce2916e5dd0354e5d129892bf96fdcdb1a9ab8eed69b9173e131db4c230"; python3.6 -c "import psycopg2; assert psycopg2.__version__.split()[0]==str(2)+chr(46)+str(9)+chr(46)+str(5)"'
          echo "RUNNER_OWNER=controlled970-fde64cdf15024d1387c7af222c2b19e0" >> "$GITHUB_ENV"
          echo "RUNNER_TAG=sha256:4a41aa9108cf2feed713134bc7b8224507f16545ba32252c0ba1f96c15c1932e" >> "$GITHUB_ENV"
      - name: Python3.6.8 real fixed packaged attest and owned recovery mechanisms (zero skips, host900)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .evidence/cold-recovery-resume
          trap 'docker --host unix:///var/run/docker.sock rm -f "cold-resume-ci-$RUNNER_OWNER" >/dev/null 2>&1 || true; python3 -B tests/cold-recovery-resume-cleanup.py' EXIT
          # Match the owned checkout UID; keep Git ownership checks enabled.
          # The explicit socket group grants only this disposable runner access.
          # Identical host/container checkout paths keep real Compose binds visible
          # to the daemon. Backend.certify replaces duplicate placeholder-policy
          # --certify-fixed; full evidence lives in backend/*/certification.json.
          timeout 900 docker --host unix:///var/run/docker.sock run --rm --pull never \
            --user "$(id -u):$(id -g)" --group-add "$(stat -c '%g' /var/run/docker.sock)" -e HOME=/tmp \
            --name "cold-resume-ci-$RUNNER_OWNER" --label "org.xianzhi.cold-resume.ci=$RUNNER_OWNER" \
            -v "$PWD:$PWD" -v /var/run/docker.sock:/var/run/docker.sock -w "$PWD" "$RUNNER_TAG" \
            sh -ec 'python3.6 -B tests/cold-recovery-resume-backend-test.py' \
            2>&1 | tee .evidence/cold-recovery-resume/ubuntu-python368.log
      - name: Independently prove fixture secrets removed, even after Docker failure
        id: fixture_sanitization
        if: always()
        run: python3 -B tests/cold-recovery-resume-cleanup.py --sanitize-only
      - name: Preserve sanitized evidence, including failure (not production readiness)
        if: always() && steps.fixture_sanitization.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: cold-recovery-resume-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .evidence/cold-recovery-resume/
            !.evidence/cold-recovery-resume/backend/**/fixture.env
            !.evidence/cold-recovery-resume/backend/**/compose.json
            !.evidence/cold-recovery-resume/backend/**/fixture-release-trust.key
          include-hidden-files: true
          if-no-files-found: error
