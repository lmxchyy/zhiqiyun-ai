name: cold-recovery-resume

on:
  pull_request:
    paths:
      - 'ops/**'
      - 'database/**'
      - 'tests/cold-recovery-resume*'
      - 'tests/issue203-safe-drain-transport.Dockerfile'
      - '.github/workflows/cold-recovery-resume.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  fixed-target-owned-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Read fixed official package using ephemeral Actions identity only
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Obtain ONLY fixed app target; absent or unauthorized is failure
        shell: bash
        run: |
          set -euo pipefail
          unset DOCKER_CONTEXT DOCKER_HOST DOCKER_TLS_VERIFY DOCKER_CERT_PATH
          mkdir -p .evidence/cold-recovery-resume
          docker --host unix:///var/run/docker.sock pull --platform linux/amd64 ghcr.io/lmxchyy/zhiqiyun-ai@sha256:6ca5046ac2bd53b4ee7e5b96bab5bb04cd8d308d8a292d4fd2004bc75609390b 2>&1 | tee .evidence/cold-recovery-resume/fixed-image-acquisition.log
          test "$(docker --host unix:///var/run/docker.sock image inspect --format '{{.Id}}' ghcr.io/lmxchyy/zhiqiyun-ai@sha256:6ca5046ac2bd53b4ee7e5b96bab5bb04cd8d308d8a292d4fd2004bc75609390b)" = sha256:3955f86a32d12e68e478c70536607455546885fa07f730a6f5c9089cd0fbf2da
      - name: Owned runner tooling, NOT an app target build
        shell: bash
        run: |
          set -euo pipefail
          docker --host unix:///var/run/docker.sock pull pgvector/pgvector:pg16
          docker --host unix:///var/run/docker.sock pull python:3.6-alpine
          docker --host unix:///var/run/docker.sock pull python:3.6.8-alpine
          owner="$(cat /proc/sys/kernel/random/uuid)"
          tag="cold-resume-runner:$owner"
          docker --host unix:///var/run/docker.sock build --label "org.xianzhi.cold-resume.ci=$owner" -f tests/issue203-safe-drain-transport.Dockerfile -t "$tag" .
          echo "RUNNER_OWNER=$owner" >> "$GITHUB_ENV"
          echo "RUNNER_TAG=$tag" >> "$GITHUB_ENV"
      - name: Python3.6.8 real fixed packaged attest and owned recovery mechanisms (zero skips, host900)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .evidence/cold-recovery-resume
          trap 'docker --host unix:///var/run/docker.sock rm -f "cold-resume-ci-$RUNNER_OWNER" >/dev/null 2>&1 || true' EXIT
          timeout 900 docker --host unix:///var/run/docker.sock run --rm --pull never \
            --name "cold-resume-ci-$RUNNER_OWNER" --label "org.xianzhi.cold-resume.ci=$RUNNER_OWNER" \
            -v "$PWD:/source" -v /var/run/docker.sock:/var/run/docker.sock -w /source "$RUNNER_TAG" \
            sh -ec 'python3.6 -B tests/cold-recovery-resume-test.py; python3.6 -B tests/cold-recovery-resume-docker-test.py --certify-fixed' \
            2>&1 | tee .evidence/cold-recovery-resume/ubuntu-python368.log
      - name: Unchanged ordinary cold contracts
        run: python3 -B tests/first-upgrade-cold-test.py
      - name: Preserve evidence, including failure (not production readiness)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cold-recovery-resume-${{ github.run_id }}-${{ github.run_attempt }}
          path: .evidence/cold-recovery-resume/
          include-hidden-files: true
          if-no-files-found: error
      - name: Remove only own runner image tag
        if: always() && env.RUNNER_TAG != ''
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker image inspect --format '{{index .Config.Labels "org.xianzhi.cold-resume.ci"}}' "$RUNNER_TAG")" = "$RUNNER_OWNER"
          docker image rm "$RUNNER_TAG"
