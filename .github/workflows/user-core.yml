name: user-core

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  user-core:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm.cmd ci --ignore-scripts

      - name: Install user-uni dependencies
        run: npm.cmd --prefix apps/user-uni ci --ignore-scripts

      - name: Install admin dependencies
        run: npm.cmd --prefix admin-vue ci --ignore-scripts

      - name: Build shared packages
        run: npm.cmd run build:packages

      - name: Install OfficeCLI 1.0.144
        shell: pwsh
        env:
          OFFICECLI_VERSION: "1.0.144"
          OFFICECLI_SHA256: E780CC6A5385F84B4D54D71B0C179904ED534125EC33FE39B1A8711FA80E387E
        run: |
          $officeCliDirectory = Join-Path $env:RUNNER_TEMP "officecli"
          New-Item -ItemType Directory -Force -Path $officeCliDirectory | Out-Null
          $officeCliPath = Join-Path $officeCliDirectory "officecli.exe"
          $officeCliUrl = "https://github.com/iOfficeAI/OfficeCLI/releases/download/v$env:OFFICECLI_VERSION/officecli-win-x64.exe"
          Invoke-WebRequest -Uri $officeCliUrl -OutFile $officeCliPath -TimeoutSec 300
          $actualHash = (Get-FileHash -Algorithm SHA256 -Path $officeCliPath).Hash
          if ($actualHash -ne $env:OFFICECLI_SHA256) {
            throw "OfficeCLI checksum mismatch: expected $env:OFFICECLI_SHA256, got $actualHash"
          }
          $actualVersion = (& $officeCliPath --version).Trim()
          if ($actualVersion -ne $env:OFFICECLI_VERSION) {
            throw "OfficeCLI version mismatch: expected $env:OFFICECLI_VERSION, got $actualVersion"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $officeCliDirectory -Encoding utf8

      - name: Node regression tests (protected surfaces)
        env:
          OFFICECLI_SKIP_UPDATE: "1"
        run: npm.cmd run test:regression

      - name: Admin unit tests (protected surfaces)
        run: npm.cmd --prefix admin-vue test

      - name: Typecheck user core
        run: npm.cmd run typecheck:user-core

      - name: Verify API client boundaries
        run: npm.cmd run verify:api-boundaries

      - name: Build H5 user clients
        run: npm.cmd run build:user-h5

      - name: Build admin client
        run: npm.cmd run build:admin

      - name: Smoke test H5 user client
        run: npm.cmd run test:user-h5:smoke

      - name: Build WeChat mini program
        run: npm.cmd run build:user-mp-weixin

      - name: Build App Plus
        run: npm.cmd run build:user-app-plus

      - name: Build Harmony App
        run: npm.cmd run build:user-app-harmony

      - name: Build Harmony mini program
        run: npm.cmd run build:user-mp-harmony

  backend-go:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: xianzhi_test
          POSTGRES_USER: codex
          POSTGRES_PASSWORD: codex
        ports:
          - 55441:5432
        options: >-
          --health-cmd "pg_isready -U codex -d xianzhi_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum

      - name: Initialize test database
        run: |
          docker exec -i -e PGPASSWORD=codex "${{ job.services.postgres.id }}" psql -h 127.0.0.1 -U codex -d xianzhi_test -v ON_ERROR_STOP=1 < database/schema.sql
          for file in database/migrations/*.sql; do
            echo "Applying $file"
            docker exec -i -e PGPASSWORD=codex "${{ job.services.postgres.id }}" psql -h 127.0.0.1 -U codex -d xianzhi_test -v ON_ERROR_STOP=1 < "$file"
          done

      - name: Test PPT V2 Phase 2 and Slice A PostgreSQL gates
        working-directory: backend-go
        env:
          PPT_TEST_DATABASE_URL: postgres://codex:codex@127.0.0.1:55441/xianzhi_test?sslmode=disable
        run: |
          set -euo pipefail
          test_names="$(go test ./internal/app/ppt -list '^TestPostgresGenerationJob')"
          for required_test in \
            TestPostgresGenerationJobLeaseFencingRestartCancelAndIsolation \
            TestPostgresGenerationJobRetryAndAtomicTaskRelation \
            TestPostgresGenerationJobArtifactConstraintsAndTransactionRollback \
            TestPostgresGenerationJobAgentOutlineApprovalRecoveryAndIsolation; do
            grep -Fxq "$required_test" <<< "$test_names"
          done
          go test ./internal/app/ppt -run '^TestPostgresGenerationJob' -count=1 -v

      - name: Test backend
        working-directory: backend-go
        run: go test ./...
