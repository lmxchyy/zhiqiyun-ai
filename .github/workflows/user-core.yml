name: user-core

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  user-core:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm.cmd ci --ignore-scripts

      - name: Install user-uni dependencies
        run: npm.cmd --prefix apps/user-uni ci --ignore-scripts

      - name: Install admin dependencies
        run: npm.cmd --prefix admin-vue ci --ignore-scripts

      - name: Build shared packages
        run: npm.cmd run build:packages

      - name: Node regression tests (protected surfaces)
        run: npm.cmd run test:regression

      - name: Admin unit tests (protected surfaces)
        run: npm.cmd --prefix admin-vue test

      - name: Typecheck user core
        run: npm.cmd run typecheck:user-core

      - name: Verify API client boundaries
        run: npm.cmd run verify:api-boundaries

      - name: Build H5 user clients
        run: npm.cmd run build:user-h5

      - name: Build admin client
        run: npm.cmd run build:admin

      - name: Smoke test H5 user client
        run: npm.cmd run test:user-h5:smoke

      - name: Build WeChat mini program
        run: npm.cmd run build:user-mp-weixin

      - name: Build App Plus
        run: npm.cmd run build:user-app-plus

      - name: Build Harmony App
        run: npm.cmd run build:user-app-harmony

      - name: Build Harmony mini program
        run: npm.cmd run build:user-mp-harmony

  backup-retention:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test backup retention dry-run
        run: |
          bash -n ops/backup-retention.sh
          node --test tests/backup-retention.test.mjs

  backend-go:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: xianzhi_test
          POSTGRES_USER: codex
          POSTGRES_PASSWORD: codex
        ports:
          - 55441:5432
        options: >-
          --health-cmd "pg_isready -U codex -d xianzhi_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum

      - name: Initialize test database
        run: |
          docker exec -i -e PGPASSWORD=codex "${{ job.services.postgres.id }}" psql -h 127.0.0.1 -U codex -d xianzhi_test -v ON_ERROR_STOP=1 < database/schema.sql
          for file in database/migrations/*.sql; do
            echo "Applying $file"
            docker exec -i -e PGPASSWORD=codex "${{ job.services.postgres.id }}" psql -h 127.0.0.1 -U codex -d xianzhi_test -v ON_ERROR_STOP=1 < "$file"
          done

      - name: Test backend
        working-directory: backend-go
        run: go test ./...
