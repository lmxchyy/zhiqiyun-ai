name: user-core

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  user-core:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm.cmd ci --ignore-scripts

      - name: Install user-uni dependencies
        run: npm.cmd --prefix apps/user-uni ci --ignore-scripts

      - name: Install admin dependencies
        run: npm.cmd --prefix admin-vue ci --ignore-scripts

      - name: Build shared packages
        run: npm.cmd run build:packages

      - name: Node regression tests (protected surfaces)
        run: npm.cmd run test:regression

      - name: Admin unit tests (protected surfaces)
        run: npm.cmd --prefix admin-vue test

      - name: Typecheck user core
        run: npm.cmd run typecheck:user-core

      - name: Verify API client boundaries
        run: npm.cmd run verify:api-boundaries

      - name: Build H5 user clients
        run: npm.cmd run build:user-h5

      - name: Build admin client
        run: npm.cmd run build:admin

      - name: Smoke test H5 user client
        run: npm.cmd run test:user-h5:smoke

      - name: Build WeChat mini program
        run: npm.cmd run build:user-mp-weixin

      - name: Build App Plus
        run: npm.cmd run build:user-app-plus

      - name: Build Harmony App
        run: npm.cmd run build:user-app-harmony

      - name: Build Harmony mini program
        run: npm.cmd run build:user-mp-harmony

  backup-retention:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test backup retention dry-run
        run: |
          bash -n ops/backup-retention.sh
          bash -n ops/backup-retention-apply.sh
          bash -n ops/backup-retention-dry-run-report.sh
          bash -n tests/backup-retention-dry-run.harness.sh
          bash -n ops/backup-retention-verify-remote.sh
          bash -n ops/backup-retention-scheduler.sh
          bash -n tests/backup-retention-automation.harness.sh
          node --test tests/backup-retention.test.mjs tests/backup-retention-automation.test.mjs tests/backup-retention-dry-run.test.mjs

      - name: Test backup offsite uploader
        run: |
          bash -n ops/backup-upload-object-storage.sh
          node --test tests/backup-offsite-upload.test.mjs tests/backup-uploader-container.test.mjs

  backup-offsite:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test Huawei OBS provider contract
        run: |
          bash -n ops/backup-upload-object-storage.sh
          node --test tests/backup-offsite-upload.test.mjs tests/backup-uploader-container.test.mjs

  production-contract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: ShellCheck deployment and release scripts
        run: |
          shellcheck deploy.sh rollback.sh ops/prestage-release.sh ops/verify-prestage-proof.sh

      - name: Test lock signals and owner lifecycle
        run: python3 tests/prestaged-lock-signals.py

      - name: Test killswitch release interlock (real Linux processes)
        run: python3 tests/killswitch-release-interlock.py

      - name: Test exact legacy NULL quarantine candidate guards (#207)
        run: python3 tests/issue207-legacy-null-approval-test.py

      - name: Test Stage 0B operator release authorization and quarantine approval
        run: python3 tests/stage0b-operator-approval-test.py

      - name: Test image DLQ killswitch preserves video canary scope
        run: python3 tests/killswitch-image-dlq-scope.py

      - name: Validate production contract image and migration replay
        run: |
          bash -n tests/production-contract.harness.sh
          bash tests/production-contract.harness.sh

      - name: Validate contract test entry point
        run: node --test tests/production-contract.test.mjs tests/migration-release.test.mjs tests/backup-retention-automation.test.mjs

      - name: Verify schema consistency across schema.sql, migrations, and runtime DDL
        run: |
          bash -n ops/run-migrations.sh
          node --test tests/schema-consistency.test.mjs

  backend-go:
    runs-on: ubuntu-latest
    env:
      XIANZHI_ANALYTICS_TEST_DATABASE_URL: postgres://codex:codex@127.0.0.1:55441/xianzhi_test?sslmode=disable
      XIANZHI_PROVIDER_EXECUTION_TEST_DATABASE_URL: postgres://codex:codex@127.0.0.1:55441/xianzhi_test?sslmode=disable
      XIANZHI_MESSAGING_TEST_DATABASE_URL: postgres://codex:codex@127.0.0.1:55441/xianzhi_messaging_test?sslmode=disable
      XIANZHI_STORAGE_TEST_DATABASE_URL: postgres://codex:codex@127.0.0.1:55441/xianzhi_test?sslmode=disable
      XIANZHI_MESSAGING_TEST_RABBITMQ_URL: amqp://guest:guest@127.0.0.1:5672/ci

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: xianzhi_test
          POSTGRES_USER: codex
          POSTGRES_PASSWORD: codex
        ports:
          - 55441:5432
        options: >-
          --health-cmd "pg_isready -U codex -d xianzhi_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:3.13-management
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
          RABBITMQ_DEFAULT_VHOST: ci
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum

      - name: Initialize isolated test databases
        run: |
          set -euo pipefail
          docker exec -e PGPASSWORD=codex "${{ job.services.postgres.id }}" createdb -h 127.0.0.1 -U codex xianzhi_messaging_test
          for database in xianzhi_test xianzhi_messaging_test; do
            docker exec -i -e PGPASSWORD=codex "${{ job.services.postgres.id }}" psql -h 127.0.0.1 -U codex -d "$database" -v ON_ERROR_STOP=1 < database/schema.sql
            while IFS= read -r file; do
              echo "Applying $file to $database"
              docker exec -i -e PGPASSWORD=codex "${{ job.services.postgres.id }}" psql -h 127.0.0.1 -U codex -d "$database" -v ON_ERROR_STOP=1 < "$file"
            done < <(find database/migrations -maxdepth 1 -type f -name '[0-9][0-9][0-9]-*.sql' ! -name '*.down.sql' -print | sort)
            docker exec -i -e PGPASSWORD=codex "${{ job.services.postgres.id }}" psql -h 127.0.0.1 -U codex -d "$database" -v ON_ERROR_STOP=1 < database/migrations/115-generation-artifact-identity.sql
          done

      - name: Test #207 fixed psql transport against CI-owned network-none PostgreSQL
        run: python3 tests/issue207-psql-transport-test.py

      - name: Test Issue 203 quarantine control plane and safe drain lifecycle
        env:
          # Destructive replay suites own unique containers, not the Go service DB.
          RELEASE_TRUST_SECRET: "ci-synthetic-test-trust-secret-only"
          ISSUE199_DOCKER_REPLAY: "1"
          XIANZHI_TEST_CONTAINER: "ci-unowned-container-must-not-be-used"
        run: |
          set -euo pipefail
          python3 tests/issue199-quarantine-drain-test.py
          python3 tests/issue203-control-plane-test.py

      - name: Test Issue 203 independent approval root (actual Python 3.6 and OpenSSL)
        run: |
          set -euo pipefail
          image="issue203-approval-synthetic-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker image rm "$image" >/dev/null 2>&1 || true' EXIT
          docker build -f tests/issue203-approval.Dockerfile -t "$image" .
          docker run --rm --network none -v "$PWD:/source:ro" "$image"

      - name: Test Issue 203 unified live snapshot and atomic enrollment (owned PG123 and Python 3.6)
        env:
          XIANZHI_TEST_CONTAINER: "ci-unowned-container-must-not-be-used"
        run: |
          set -euo pipefail
          # Harness builds a UUID-owned tag, validates ownership, runs the built
          # immutable ID and untags only its own image (never a shared image ID).
          PYTHONDONTWRITEBYTECODE=1 python3 tests/issue203-live-snapshot-test.py

      - name: Test Issue 203 runtime quarantine zero side-effects and race safety (CGO -race clean)
        env:
          XIANZHI_TEST_CONTAINER: "ci-unowned-container-must-not-be-used"
        run: |
          set -euo pipefail
          python3 tests/issue203-runtime-race-test.py

      - name: Test Issue 203 actual Python 3.6 runtime compatibility
        run: |
          set -euo pipefail
          docker run --rm --network none \
            -v "$PWD:/workspace:ro" -w /workspace \
            -e PYTHONDONTWRITEBYTECODE=1 \
            python:3.6-alpine python tests/issue203-control-plane-test.py ControlPlaneUnitTests

      - name: Test Issue 190 real PostgreSQL dispatch ownership (no SKIP)
        working-directory: backend-go
        env:
          ISSUE190_REQUIRE_POSTGRES: "1"
        run: |
          set -euo pipefail
          go test -race -count=1 -timeout 5m -json ./internal/httpserver -run '^TestIssue190Postgres(A|B|C|D|E|Connector)$' | tee issue190-postgres.json
          python3 ../tests/assert-issue190-integration.py issue190-postgres.json

      - name: Test Batch A provider recovery (uncached)
        working-directory: backend-go
        run: go test -count=1 -v ./internal/providerexecution ./internal/httpserver -run 'TestTEST_|TestCrashMatrix|TestGuarded'

      - name: Test RabbitMQ integration (uncached)
        working-directory: backend-go
        run: go test -count=1 -v ./internal/messaging -run 'TestRabbitMQRuntimeRecoveryRetryDLQAndChannelRecreation|TestRabbitMQGenerationManualAckRedelivery'

      - name: Test artifact claim concurrency (uncached)
        working-directory: backend-go
        run: go test -count=1 -v ./internal/storage -run '^TestArtifactConcurrencyClaimIdentity(Postgres)?$'

      - name: Test async canary operations readiness (uncached)
        working-directory: backend-go
        env:
          PR83_CANARY_PREFLIGHT_SIDE_EFFECT_CHECK: "1"
        run: go test -p 1 -count=1 -v ./internal/httpserver ./internal/canarypreflight -run '^(TestTEST_A_AllowedImageSelectsAsync|TestTEST_B_ProviderDeniedFallsBackSync|TestTEST_C_ModelDeniedFallsBackSync|TestTEST_D_UserDeniedFallsBackSync|TestTEST_E_EmptyProviderAllowlistFailsClosed|TestTEST_F_EmptyModelAllowlistFailsClosed|TestTEST_G_VideoNeverSelectedForStage0|TestTEST_H_UnsupportedGenerationTypesNeverSelected|TestTEST_I_MetricsRegisteredAndExposed|TestTEST_J_OutboxObservability|TestTEST_K_ProviderExecutionUnknownStaleObservability|TestTEST_L_PointsUnsettledObservability|TestTEST_M_ArtifactRecoveryFailureObservability|TestTEST_N_KillSwitchStopsNewAsyncPreservesDrain|TestTEST_O_PreflightRejectsMissingMigrations|TestTEST_P_PreflightRejectsRabbitMQFailure|TestTEST_Q_PreflightIsSideEffectFree|TestAsyncCanaryOperationalMetricsSampleDurablePostgresState|TestGenerationAsyncCanaryEligibilityIsServerControlled|TestPreflightOutputContainsStableMachineReadableKeys|TestTEST_01_WildcardTextToImageSelectsAsync|TestTEST_02_WildcardImageToImageSelectsAsync|TestTEST_03_WildcardProviderDeniedFallsBackSync|TestTEST_04_WildcardModelDeniedFallsBackSync|TestTEST_05_WildcardVideoNeverSelected|TestTEST_06_EmptyUsersFailsClosed|TestTEST_07_ExplicitUserMatches|TestTEST_08_ExplicitUserMismatchedRejected|TestTEST_09_KillSwitchWithWildcardUsers|TestTEST_10_MixedCSVWithWildcard|TestTEST_11_TokensLikeAllNotWildcard|TestTEST_12_TokenTrueNotWildcard|TestProviderAndModelAllowlistsDoNotInheritWildcard|TestPreflightUserAllowlistWildcardValid)$'

      - name: Build backend
        working-directory: backend-go
        run: go build ./...

      - name: Test backend (uncached)
        working-directory: backend-go
        run: go test -count=1 ./...
