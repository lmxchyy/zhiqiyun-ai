name: immutable-image-release

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read
  packages: write

jobs:
  release-image:
    runs-on:
      - self-hosted
      - linux
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      IMAGE_TAG: git-${{ github.sha }}
      TARGET_PLATFORM: linux/amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set lowercase image name
        shell: bash
        run: |
          echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"
          echo "PRODUCTION_CONTRACT_IMAGE=${IMAGE,,}:$IMAGE_TAG" >> "$GITHUB_ENV"
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR for main releases
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build production image once
        run: docker buildx build --platform "$TARGET_PLATFORM" --tag "$IMAGE:$IMAGE_TAG" --load .
      - name: Run production contract against the built image
        env:
          RUN_PRODUCTION_CONTRACT_DOCKER: "1"
        run: |
          bash -n tests/production-contract.harness.sh
          bash tests/production-contract.harness.sh
      - name: Push the tested image and write release manifest
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -Eeuo pipefail
          docker push "$IMAGE:$IMAGE_TAG"
          ghcr_digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$IMAGE_TAG" | sed 's#^.*@##')"
          [[ "$ghcr_digest" =~ ^sha256:[0-9a-f]{64}$ ]]

          : "${ALIYUN_REGISTRY:?ALIYUN_REGISTRY secret is required}"
          : "${ALIYUN_USERNAME:?ALIYUN_USERNAME secret is required}"
          : "${ALIYUN_PASSWORD:?ALIYUN_PASSWORD secret is required}"
          ACR_IMAGE="$ALIYUN_REGISTRY/zhiqiyun-ai/zhiqiyun-ai"
          printf '%s' "$ALIYUN_PASSWORD" | docker login "$ALIYUN_REGISTRY" --username "$ALIYUN_USERNAME" --password-stdin >/dev/null
          docker tag "$IMAGE:$IMAGE_TAG" "$ACR_IMAGE:$IMAGE_TAG"
          docker push "$ACR_IMAGE:$IMAGE_TAG"
          acr_digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$ACR_IMAGE:$IMAGE_TAG" | sed 's#^.*@##')"
          [[ "$acr_digest" =~ ^sha256:[0-9a-f]{64}$ ]]

          ghcr_raw="$(mktemp)"
          acr_raw="$(mktemp)"
          trap 'rm -f "$ghcr_raw" "$acr_raw"' EXIT
          docker buildx imagetools inspect "$IMAGE:$IMAGE_TAG" --raw > "$ghcr_raw"
          docker buildx imagetools inspect "$ACR_IMAGE:$IMAGE_TAG" --raw > "$acr_raw"
          python3 - "$ghcr_raw" "$acr_raw" <<'PY'
          import json
          import sys
          def content(path):
              data = json.load(open(path, "r"))
              if "manifests" in data:
                  manifests = data["manifests"]
                  if len(manifests) != 1:
                      raise SystemExit("expected one platform manifest")
                  data = manifests[0]
              return data.get("config", {}).get("digest"), tuple(item.get("digest") for item in data.get("layers", []))
          if content(sys.argv[1]) != content(sys.argv[2]):
              raise SystemExit("GHCR and ACR OCI config/layers differ")
          print("registry_content_match=PASS")
          PY

          python3 - "$GITHUB_SHA" "$IMAGE" "$ghcr_digest" "$ACR_IMAGE" "$acr_digest" <<'PY'
          import datetime
          import json
          import sys
          git_sha, image, digest, acr_image, acr_digest = sys.argv[1:]
          manifest = {
              "git_sha": git_sha,
              "image": image,
              "digest": digest,
              "image_reference": image + "@" + digest,
              "preferred_registry": "aliyun_acr",
              "registries": {
                  "ghcr": {
                      "image": image,
                      "digest": digest,
                      "image_reference": image + "@" + digest,
                  },
                  "aliyun_acr": {
                      "image": acr_image,
                      "digest": acr_digest,
                      "image_reference": acr_image + "@" + acr_digest,
                  },
              },
              "built_at": datetime.datetime.utcnow().replace(microsecond=0).isoformat() + "Z",
              "production_contract": "passed",
          }
          with open("release-manifest.json", "w") as handle:
              json.dump(manifest, handle, indent=2, sort_keys=True)
              handle.write("\n")
          PY
          bash ops/verify-release-manifest.sh release-manifest.json "$GITHUB_SHA" "$IMAGE@$ghcr_digest"
          bash ops/verify-release-manifest.sh release-manifest.json "$GITHUB_SHA" "$ACR_IMAGE@$acr_digest" aliyun_acr
        env:
          ALIYUN_REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
          ALIYUN_USERNAME: ${{ secrets.ALIYUN_USERNAME }}
          ALIYUN_PASSWORD: ${{ secrets.ALIYUN_PASSWORD }}
      - name: Upload release manifest
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest-${{ github.sha }}
          path: release-manifest.json
          if-no-files-found: error
