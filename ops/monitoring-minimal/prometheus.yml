# Minimal scrape configuration for the xianzhi API.
# Merge the scrape_configs entry into your existing Prometheus deployment;
# adjust targets to how the API is reached from Prometheus (compose service
# name, container port, or host port).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: xianzhi-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - api:3100
        labels:
          service: xianzhi-ai
          component: api
