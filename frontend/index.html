<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>先知 AI 工作台</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/workflow.css">
</head>
<body>
  <div id="login" class="login-shell">
    <div class="login-card">
      <span class="eyebrow">XIANZHI AI PLATFORM</span>
      <h1>让创意成为可交付成果</h1>
      <p>AI 内容生产、智能体、GEO 与渠道商业化的一站式工作台。</p>
      <form id="login-form">
        <label>邮箱<input id="email" value="demo@xianzhi.ai" type="email" required></label>
        <label>密码<input id="password" value="Demo123!" type="password" required></label>
        <button type="submit">进入工作台</button>
      </form>
      <small>演示账号已预填，也可使用 admin@xianzhi.ai / Admin123!</small>
    </div>
  </div>

  <div id="app" class="app hidden">
    <aside>
      <div class="brand"><span>先知</span><strong>AI</strong></div>
      <nav id="nav"></nav>
      <button class="ghost" id="logout">退出登录</button>
    </aside>
    <main>
      <header>
        <div><span class="eyebrow">AI OPERATING SYSTEM</span><h1 id="page-title">运营总览</h1></div>
        <div class="profile"><span id="points"></span><strong id="user-name"></strong></div>
      </header>
      <section id="content"></section>
    </main>
  </div>
  <div id="toast"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
