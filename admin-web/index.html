<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>先知 AI 主控 SaaS</title>
    <link rel="stylesheet" href="/admin/styles.css" />
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <div class="brand">
          <span class="brand-mark">先</span>
          <div>
            <strong>先知 AI</strong>
            <small>主控 SaaS</small>
          </div>
        </div>
        <nav id="nav" class="nav"></nav>
      </aside>
      <main class="main">
        <header class="topbar">
          <div>
            <p class="eyebrow">Master Control</p>
            <h1 id="page-title">数据中心</h1>
          </div>
          <div class="top-actions">
            <span id="api-status" class="status-dot">连接中</span>
            <span class="account">平台管理员</span>
          </div>
        </header>
        <section id="metrics" class="metrics"></section>
        <section class="content">
          <div class="section-head">
            <div>
              <p id="section-kicker" class="eyebrow">Overview</p>
              <h2 id="section-title">经营概览</h2>
            </div>
            <div id="section-meta" class="meta"></div>
          </div>
          <div id="panel" class="panel"></div>
        </section>
      </main>
    </div>
    <script src="/admin/app.js"></script>
  </body>
</html>
